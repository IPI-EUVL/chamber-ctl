[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipi-chamber-ctl"
version = "0.1.2"
description = "IPI EUVL chamber control system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ipi-ecs>=0.1.7",
  "prompt_toolkit>=3.0",
  "numpy>=2.4.0",
  "h5py>=3.11",
  "ipi-euv-acquisition>=0.1.4",
  "matplotlib>=3.8",
  "plotly>=5.24",
  "portalocker>=4.1,<5",
  "pyvisa>=1.16.0",
  "scipy>=1.17.0"
]

license = { text = "MIT" }
authors = [
  { name = "Illinois Plasma Institute" },
  { name = "Alp Doganer", email = "doganer2@illinois.edu" },
]
maintainers = [
  { name = "Alp Doganer", email = "doganer2@illinois.edu" },
]

[project.scripts]
chamber-lifecycle-manager = "chamber_ctl.services.lifecycle_manager_service:main"
chamber-ctl = "chamber_ctl.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]
